name: Public checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python compiles and launches
        run: python tools/run.py --setup

      - name: Algorithm examples in student repositories
        if: github.repository != 'RZhaniya/daa-assignment-4-archive'
        run: python tools/run.py --check
